[project]
name = "bdb27"
version = "0.1.0"
description = "NFL Big Data Bowl 2027: Combine tracking -> NFL performance"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]
nn = ["torch>=2.4"]

[project.scripts]
bdb27 = "bdb27.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdb27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
